const tintCache = new Map();
function tinted(name, f, color) {
  const key = name + '|' + f + '|' + color; let c = tintCache.get(key);

  return c;
}
function spr(name, f, x, y, o = {}) {
  const s = SPRI[name]; if (!s) return; f = Math.max(0, Math.min(s.img.length - 1, f | 0));

}

function drawGame(t, dt) {
  if (!GS.paused) updateGame(Math.min(dt, .05));
  const g = GS, p = g.p;
  ctx.save(); if (g.shake > 0) ctx.translate(Math.round((rnd() - .5) * g.shake * 6), Math.round((rnd() - .5) * g.shake * 5));
  drawBackground(t);
  // saida do hiperespaco: riscos verticais
  if (g.intro > 0) { const k = clamp(g.intro / 2.6); for (let i = 0; i < 70; i++) { const x = hash(i * 1.3) * W, y = ((hash(i * 2.1) * H + t * 900) % (H + 80)) - 40, l = 10 + k * 70 * hash(i * 3.7); line(x, y, x, y + l, hash(i * 5) > .6 ? '#cfe8ff' : '#6a8cff'); } }
  // cenarios

  // estruturas e partes
  for (const e of g.enemies) if (e.alive && e.fixed) drawEnemy(e, t);
  // aliados
  for (const a of g.allies) if (a.alive) { spr(a.spr, 0, a.x, a.y); }
  // inimigos
  for (const e of g.enemies) if (e.alive && !e.fixed) drawEnemy(e, t);
  // minas
  for (const m of g.mines) { spr('mine', 0, m.x, m.y); if (blink(t, 3)) px(m.x, m.y, C.red); }
  // tiros
  for (const s of g.shots) { const S = SHOT[s.st]; fill(s.x - Math.floor(S.w / 2), s.y - S.h / 2, S.w, S.h, S.c); if (s.st === 1) px(s.x, s.y - 3, C.wht); }
  for (const tp of g.torpsF) { fill(tp.x - 1, tp.y - 1, 3, 3, '#bff6ff'); px(tp.x - tp.vx * .03, tp.y - tp.vy * .03, C.cyan); px(tp.x - tp.vx * .06, tp.y - tp.vy * .06, C.cyanD); }
  // feixe da Zenith
  if (t - (g.beamT ?? -9) < .25) { const a = 1 - (t - g.beamT) / .25; fill(p.x - 3, 0, 7, p.y - 10, C.sky); fill(p.x - 1, 0, 3, p.y - 10, a > .5 ? C.wht : C.sky); }
  // jogador
  if (!(g.end === 'down')) drawPlayer(t);
  if (g.droneT > 0) spr('ally_drone', 0, p.x + 24, p.y + 4 + Math.sin(t * 6) * 2);
  // tiros inimigos por cima de tudo
  for (const b of g.bullets) { if (b.emp) { fillCircle(b.x, b.y, 3, C.cyan); px(b.x, b.y, C.wht); } else { fill(b.x - 1, b.y - 1, 3, 3, C.red); px(b.x, b.y, '#ffd0c0'); } }
  drawFx(t);
  if (g.fog) drawFog(t);
  ctx.restore();
  drawGameHUD(t);
}
