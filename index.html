const MISSIONS = MDATA.map(m => [m.name, m.place]);

function dropMines() { for (const k of [-.5, -.3, -.1, .1, .3, .5]) { const d = camFwd().applyAxisAngle(AX_Y, k); d.y += (rnd() - .5) * .3; const m = take('mine'); const pos = d.normalize().multiplyScalar(38 + rnd() * 8); m.position.copy(pos); GS.mines.push({ pos, m, t0: GS.t }); } }

      if (best) { const from = DRONE.getWorldPosition(new THREE.Vector3()); G.shots.push({ from, to: best.pos.clone(), tgt: best, t: G.t, mesh: take('shot'), dmg: G.dmg * .6 }); beep(2000, .02, 'square', .015); } G.droneF = .32; }
